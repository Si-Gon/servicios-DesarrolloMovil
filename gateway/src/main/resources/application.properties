spring.application.name=gateway
server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Rutas: cada prefijo tiene su servicio dueño. Los catálogos van primero porque /api/catalogos/**
# resume las cinco tablas maestras para los desplegables de la app.
spring.cloud.gateway.server.webflux.routes[0].id=catalogos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://catalogos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/catalogos/**

spring.cloud.gateway.server.webflux.routes[1].id=usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuarios
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[2].id=medicion
spring.cloud.gateway.server.webflux.routes[2].uri=lb://medicion
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/sesiones/**,/api/registros/**,/api/eventos/**,/api/conteos/**,/api/transacciones/**,/api/indicadores/**,/api/metas/**,/api/pendientes/**

# CORS solo en el borde: si el servicio también lo declara, la respuesta sale con dos
# cabeceras y el navegador la rechaza.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# El balanceador cachea la lista de Eureka: con 5 s, un servicio recién levantado rutea rápido.
spring.cloud.loadbalancer.cache.ttl=5s

management.endpoints.web.exposure.include=health,info,gateway

# La misma clave con la que firma usuarios. En un despliegue real va por variable de entorno.
rinconsur.seguridad.clave=${TOKEN_CLAVE:NUdheFJpbmNvblN1cjIwMjYtY2xhdmUtZGVtby1oczI1Ni1rZXk=}

# Swagger: una sola página con las tres APIs. Cada entrada pide el documento al servicio
# dueño a través de esta misma puerta, así no hay que abrir tres pestañas ni pelear con CORS.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Catálogos
springdoc.swagger-ui.urls[0].url=/docs/catalogos/v3/api-docs
springdoc.swagger-ui.urls[1].name=Usuarios
springdoc.swagger-ui.urls[1].url=/docs/usuarios/v3/api-docs
springdoc.swagger-ui.urls[2].name=Medición
springdoc.swagger-ui.urls[2].url=/docs/medicion/v3/api-docs

# Rutas de documentación: /docs/<servicio>/... se reescribe al path real del servicio.
spring.cloud.gateway.server.webflux.routes[3].id=docs-catalogos
spring.cloud.gateway.server.webflux.routes[3].uri=lb://catalogos
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/catalogos/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/docs/catalogos/(?<resto>.*), /${resto}

spring.cloud.gateway.server.webflux.routes[4].id=docs-usuarios
spring.cloud.gateway.server.webflux.routes[4].uri=lb://usuarios
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/usuarios/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/docs/usuarios/(?<resto>.*), /${resto}

spring.cloud.gateway.server.webflux.routes[5].id=docs-medicion
spring.cloud.gateway.server.webflux.routes[5].uri=lb://medicion
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/medicion/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/docs/medicion/(?<resto>.*), /${resto}
